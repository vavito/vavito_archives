name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: quality-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  api:
    name: Quality / API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vavito_integration
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vavito_integration
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vavito_integration
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: vavito_integration
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d vavito_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js e pnpm
        uses: pnpm/setup@v1
        with:
          cache: true
          install: false
          runtime: node@24.18.0

      - name: Restaurar cache do Turborepo
        uses: actions/cache@v4
        with:
          key: turbo-${{ runner.os }}-api-${{ github.sha }}
          path: .turbo
          restore-keys: |
            turbo-${{ runner.os }}-api-
            turbo-${{ runner.os }}-

      - name: Instalar dependências do monorepo
        run: pnpm install --frozen-lockfile

      - name: Validar formatação
        run: pnpm format:check

      - name: Preparar schema do Supabase Auth para integração
        run: pnpm --filter @vavito/api test:integration:prepare

      - name: Aplicar migrations no PostgreSQL de integração
        run: pnpm --filter @vavito/api prisma:migrate:deploy

      - name: Executar regressão da API com cobertura
        run: pnpm test:regression:api

      - name: Validar API e dependências internas
        run: pnpm turbo run lint typecheck build --filter=@vavito/api...

  web:
    name: Quality / Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js e pnpm
        uses: pnpm/setup@v1
        with:
          cache: true
          install: false
          runtime: node@24.18.0

      - name: Restaurar cache do Turborepo
        uses: actions/cache@v4
        with:
          key: turbo-${{ runner.os }}-web-${{ github.sha }}
          path: .turbo
          restore-keys: |
            turbo-${{ runner.os }}-web-
            turbo-${{ runner.os }}-

      - name: Instalar dependências do monorepo
        run: pnpm install --frozen-lockfile

      - name: Validar formatação
        run: pnpm format:check

      - name: Verificar tipos gerados pelo contrato OpenAPI
        run: pnpm api-client:check

      - name: Executar testes do frontend
        run: pnpm turbo run test --filter=@vavito/web...

      - name: Validar infraestrutura dos testes de navegador
        run: pnpm --filter @vavito/e2e lint && pnpm --filter @vavito/e2e test

      - name: Instalar navegador dos testes públicos
        run: pnpm --filter @vavito/e2e exec playwright install --with-deps chromium webkit

      - name: Executar fluxos públicos no navegador
        run: pnpm test:e2e:public

      - name: Executar fluxos autenticados com contas isoladas
        run: pnpm test:e2e:auth

      - name: Validar lint, tipos e build Vercel
        run: pnpm turbo run lint typecheck build --filter=@vavito/web...
